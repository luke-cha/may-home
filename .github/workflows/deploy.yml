name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Trim non-web source documents from the artifact
        run: find dist -type f \( -name '*.docx' -o -name '*.pdf' -o -name '*.txt' \) -delete

      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Report artifact size
        run: du -sh dist && find dist -type f | wc -l

      - uses: actions/configure-pages@v5
        with:
          # Turn Pages on automatically so the first run does not fail with
          # "Get Pages site failed".
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
